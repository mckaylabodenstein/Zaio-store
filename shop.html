<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urban Threads | Shop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <h1 class="logo">Urban Threads</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="cart.html">Cart</a>
      <a href="admin.html">Admin</a>
      <a href="login.html" id="authLink">Login</a>
      <span id="userDisplay"></span>
      <button id="themeToggle" class="nav-btn" type="button">🌙</button>
      <button id="logoutBtn" class="nav-btn hidden" type="button">Logout</button>
    </nav>
  </header>

  <main class="section">
    <h2>Shop Products</h2>

    <div class="filter-bar glass">
      <input type="text" id="searchInput" placeholder="Search products..." />
      <select id="categoryFilter">
        <option value="All">All Categories</option>
        <option value="Hoodies">Hoodies</option>
        <option value="T-shirts">T-shirts</option>
        <option value="Sneakers">Sneakers</option>
        <option value="Accessories">Accessories</option>
      </select>
    </div>

    <div id="productContainer" class="product-grid"></div>
  </main>

  <footer>
    <p>© 2026 Urban Threads. All rights reserved.</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
